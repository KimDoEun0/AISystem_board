<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실시간 방명록</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --sub:#6e6e73; --accent:#2563eb; --border:#e5e5ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --card:#1c1c1e; --text:#f5f5f7; --sub:#a1a1a6; --accent:#60a5fa; --border:#2c2c2e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         background:var(--bg); color:var(--text); }
  main { max-width:640px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .status { font-size:.85rem; color:var(--sub); margin-bottom:16px; }
  form { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; display:grid; gap:10px; }
  input, textarea { width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;
                    font:inherit; background:var(--bg); color:var(--text); }
  textarea { resize:vertical; min-height:80px; }
  .row { display:flex; justify-content:space-between; align-items:center; }
  .count { font-size:.8rem; color:var(--sub); }
  button { padding:10px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .error { color:#dc2626; font-size:.85rem; min-height:1em; }
  ul { list-style:none; padding:0; margin:20px 0 0; display:grid; gap:10px; }
  li { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
  .meta { display:flex; justify-content:space-between; gap:8px; font-size:.85rem; color:var(--sub); margin-bottom:6px; }
  .name { font-weight:600; color:var(--text); }
  .msg { white-space:pre-wrap; word-break:break-word; }
</style>
</head>
<body>
<main>
  <h1>실시간 방명록</h1>
  <div class="status" id="status">연결 중…</div>

  <form id="form">
    <input id="name" maxlength="20" placeholder="이름 (최대 20자)" required>
    <textarea id="message" maxlength="300" placeholder="메시지 (최대 300자)" required></textarea>
    <div class="row">
      <span class="count" id="count">0 / 300</span>
      <button type="submit" id="submit">남기기</button>
    </div>
    <div class="error" id="error"></div>
  </form>

  <ul id="list"></ul>
</main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyvNvNmTi2ZAECH3hrwNVsRZkIbIgF-HAA7GE3RcQjmGTSe4l15HytFD5qBBkd7kaha/exec';
const POLL_MS = 3000;

const $ = id => document.getElementById(id);
const list = $('list');
let lastId = 0;
let timer = null;
let busy = false;

function render(entries) {
  entries.forEach(e => {
    const li = document.createElement('li');
    const meta = document.createElement('div');
    meta.className = 'meta';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = e.name;
    const time = document.createElement('span');
    time.textContent = new Date(e.time).toLocaleString('ko-KR');
    meta.append(name, time);

    const msg = document.createElement('div');
    msg.className = 'msg';
    msg.textContent = e.message;

    li.append(meta, msg);
    list.prepend(li); // 최신 글이 위로
  });
}

async function poll() {
  if (busy) return;
  busy = true;
  try {
    const res = await fetch(`${API_URL}?after=${lastId}`);
    const data = await res.json();
    if (!data.ok) throw new Error();
    if (data.reset) { list.innerHTML = ''; lastId = 0; }
    if (data.entries.length) {
      render(data.entries);
      lastId = data.entries[data.entries.length - 1].id;
    }
    $('status').textContent =
      `글 ${data.total}개 · 마지막 확인 ${new Date().toLocaleTimeString('ko-KR')}`;
  } catch (err) {
    $('status').textContent = '연결 오류 — 자동으로 다시 시도합니다.';
  } finally {
    busy = false;
  }
}

// 이전 요청이 끝난 뒤 다음 요청을 예약 (요청 겹침 방지)
function schedule() {
  clearTimeout(timer);
  timer = setTimeout(async () => { await poll(); schedule(); }, POLL_MS);
}

// 탭이 숨겨지면 polling 중지
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) {
    clearTimeout(timer);
  } else {
    await poll();
    schedule();
  }
});

$('message').addEventListener('input', () => {
  $('count').textContent = `${$('message').value.length} / 300`;
});

$('form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const name = $('name').value.trim();
  const message = $('message').value.trim();
  if (!name || !message) return;

  $('submit').disabled = true;
  $('error').textContent = '';
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // preflight 회피
      body: JSON.stringify({ name, message })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    $('message').value = '';
    $('count').textContent = '0 / 300';
    await poll(); // 작성 직후 바로 반영
  } catch (err) {
    $('error').textContent = err.message || '전송에 실패했습니다.';
  } finally {
    $('submit').disabled = false;
  }
});

poll().then(schedule);
</script>
</body>
</html>
