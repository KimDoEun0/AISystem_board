<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지역별 관광정보 조회</title>
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f8f9fa;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }
    select, button {
      padding: 10px 15px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .status-msg {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .card {
      background-color: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background-color: #e9ecef;
    }
    .card-body {
      padding: 15px;
      flex-grow: 1;
    }
    .card-title {
      font-size: 16px;
      font-weight: bold;
      margin: 0 0 10px 0;
      color: #212529;
    }
    .card-text {
      font-size: 13px;
      color: #6c757d;
      margin: 0;
    }
  </style>
</head>
<body>

  <h1>🏖️ 지역별 관광정보 조회</h1>
  
  <div class="controls">
    <select id="areaCodeSelect">
      <option value="">지역을 선택하세요</option>
      <option value="1">서울</option>
      <option value="2">인천</option>
      <option value="3">대전</option>
      <option value="4">대구</option>
      <option value="5">광주</option>
      <option value="6">부산</option>
      <option value="7">울산</option>
      <option value="8">세종</option>
      <option value="31">경기</option>
      <option value="32">강원</option>
      <option value="39">제주</option>
    </select>
    <button id="searchBtn">조회하기</button>
  </div>

  <div id="statusMsg" class="status-msg">데이터 확인 중...</div>
  <div id="tourGrid" class="grid-container"></div>

  <!-- Firebase SDK (Modular v10+) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 1. Firebase 설정 (본인의 프로젝트 설정으로 교체)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Firebase 초기화
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 공공데이터 API 설정
    const API_KEY = "YOUR_PUBLIC_DATA_API_KEY"; // Decoding 인증키 입력
    const API_URL = "https://apis.data.go.kr/B551011/KorService1/areaBasedList1";

    const selectEl = document.getElementById('areaCodeSelect');
    const searchBtn = document.getElementById('searchBtn');
    const tourGrid = document.getElementById('tourGrid');
    const statusMsg = document.getElementById('statusMsg');

    // 페이지 로드 시 Firebase 상태 확인
    window.addEventListener('DOMContentLoaded', loadInitialData);

    // [지침 준수 1] 최초 로딩 시 Firebase 데이터 확인 및 표출 조건 처리
    async function loadInitialData() {
      const dbRef = ref(db);
      try {
        const snapshot = await get(child(dbRef, 'userLastSelection'));
        if (snapshot.exists()) {
          const data = snapshot.val();
          statusMsg.innerText = `마지막으로 저장된 지역(${data.areaName})의 정보입니다.`;
          selectEl.value = data.areaCode;
          renderItems(data.items);
        } else {
          // 저장된 데이터가 없는 경우 뷰를 비움
          statusMsg.innerText = "저장된 지역 정보가 없습니다. 지역을 선택해주세요.";
          tourGrid.innerHTML = "";
        }
      } catch (error) {
        console.error("Firebase 읽기 에러:", error);
        statusMsg.innerText = "초기 데이터를 불러오는데 실패했습니다.";
        tourGrid.innerHTML = "";
      }
    }

    // [지침 준수 2] 버튼 클릭 시 API 호출 -> 화면 표출 -> Firebase 업데이트
    searchBtn.addEventListener('click', async () => {
      const areaCode = selectEl.value;
      const areaName = selectEl.options[selectEl.selectedIndex].text;

      if (!areaCode) {
        alert("지역을 선택해주세요.");
        return;
      }

      statusMsg.innerText = "관광 정보를 불러오는 중...";

      try {
        // 1. API 호출
        const items = await fetchTourData(areaCode);
        
        // 2. 화면에 목록 뷰 표출
        renderItems(items);

        // 3. Firebase 저장 (지역 선택 시마다 덮어쓰기/업데이트)
        await saveToFirebase(areaCode, areaName, items);

        statusMsg.innerText = `현재 표출 중인 지역: ${areaName} (Firebase 저장 완료)`;
      } catch (error) {
        console.error("오류 발생:", error);
        statusMsg.innerText = "데이터를 불러오는 중 오류가 발생했습니다.";
      }
    });

    // 공공데이터 API Fetch 함수
    async function fetchTourData(areaCode) {
      const params = new URLSearchParams({
        serviceKey: API_KEY,
        numOfRows: '12',
        pageNo: '1',
        MobileOS: 'ETC',
        MobileApp: 'AppTest',
        _type: 'json',
        listYN: 'Y',
        arrange: 'A',
        areaCode: areaCode
      });

      const response = await fetch(`${API_URL}?${params.toString()}`);
      const data = await response.json();
      
      const rawItems = data.response?.body?.items?.item || [];
      
      return rawItems.map(item => ({
        title: item.title,
        addr1: item.addr1 || '주소 정보 없음',
        image: item.firstimage || item.firstimage2 || 'https://via.placeholder.com/300x200?text=No+Image'
      }));
    }

    // 시각화 목록 뷰 렌더링 함수
    function renderItems(items) {
      tourGrid.innerHTML = "";

      if (items.length === 0) {
        tourGrid.innerHTML = "<p>조회된 관광지 정보가 없습니다.</p>";
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.image}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
          <div class="card-body">
            <h3 class="card-title">${item.title}</h3>
            <p class="card-text">${item.addr1}</p>
          </div>
        `;
        tourGrid.appendChild(card);
      });
    }

    // Firebase 데이터 업데이트 함수
    async function saveToFirebase(areaCode, areaName, items) {
      await set(ref(db, 'userLastSelection'), {
        areaCode: areaCode,
        areaName: areaName,
        items: items,
        updatedAt: new Date().toISOString()
      });
    }
  </script>
</body>
</html>
